name: Download file from Google Drive

on:
  push:
    paths:
      - '.github/workflows/download.yml'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  FILE_ID: 18ITE4nXa0eYQqZueqnnzcLJQyNhhyHW7

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Stream download, split and upload to Release
        run: |
          set -euo pipefail
          URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"

          HDR="$(curl -sIL --max-time 60 "$URL" | grep -i '^content-disposition' | tail -n 1 || true)"
          echo "content-disposition: ${HDR:-<none>}"
          NAME="$(printf '%s' "$HDR" | grep -oE 'filename\*?="?[^";]+' | tail -n 1 | sed -e 's/^filename\*?=//' -e "s/^UTF-8''//" -e 's/^"//' -e 's/"$//')"
          NAME="$(basename "${NAME:-gdrive_file.zip}")"
          echo "remote filename: $NAME"

          TAG="gdrive-file"
          export TAG

          cat > /tmp/upload_part.sh <<'EOS'
          #!/bin/bash
          set -e
          cat > "$FILE"
          for i in 1 2 3; do
            gh release upload "$TAG" "$FILE" --clobber && exit 0
            echo "upload failed, retry $i"
            sleep 10
          done
          exit 1
          EOS
          chmod +x /tmp/upload_part.sh

          gh release create "$TAG" --title "$NAME" --notes "Downloaded from Google Drive (id: ${FILE_ID}). Reassemble: cat ${NAME}.part-* > ${NAME}" || echo "release exists, reusing"

          mkdir -p /tmp/parts && cd /tmp/parts
          df -h .
          curl -sL --retry 3 --retry-all-errors "$URL" | split -b 1800m --numeric-suffixes=1 --filter=/tmp/upload_part.sh - "${NAME}.part-"
          echo "ALL PARTS UPLOADED"
          df -h .
