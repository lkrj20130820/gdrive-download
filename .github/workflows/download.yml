name: Download file from Google Drive

on:
  push:
    paths:
      - '.github/workflows/download.yml'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gdown
        run: pip install gdown

      - name: Download from Google Drive
        run: |
          set -e
          mkdir -p /tmp/gd
          cd /tmp/gd
          if ! gdown --fuzzy "https://drive.google.com/file/d/18ITE4nXa0eYQqZueqnnzcLJQyNhhyHW7/view?usp=sharing"; then
            echo "gdown failed, falling back to curl"
            curl -sL -o downloaded.bin "https://drive.usercontent.google.com/download?id=18ITE4nXa0eYQqZueqnnzcLJQyNhhyHW7&export=download&confirm=t"
          fi
          ls -la
          file * || true
          cp -r /tmp/gd/. "$GITHUB_WORKSPACE/"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add file downloaded from Google Drive" || echo "No changes to commit"
          git push
